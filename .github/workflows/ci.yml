name: CI

# Nothing ran on a pull request before this. `deploy.yml` runs lint and the tests,
# but only on a push to main -- and its path filter omits `packages/cli/**`, so a
# CLI-only change reached main having been checked by nobody. That is how a stale
# committed bundle can ship: the thing that would have caught it never ran.
on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds both dists in the order the bundling requires and asserts the
      # release invariants: the two versions move together, and the CLI bundle
      # still inlines the core. On a PR it is really a build check -- `dist/` is
      # gitignored, so nothing here is published -- but it catches a core change
      # that breaks the CLI build before that surfaces at publish time.
      - name: Release checks
        run: npm run check:release
